[project]
name = "tab-uf-forecaster"
version = "0.1.0"
description = "Sistema de Proyección Financiera de Tasas TAB UF con CBF"
authors = [{ name = "Quant Team" }]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "plotly>=5.22.0",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
